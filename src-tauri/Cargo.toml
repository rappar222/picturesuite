[package]
name = "picturesuite"
version = "0.1.0"
description = "PictureSuite - Fast AI Image Studio in Rust"
authors = ["PictureSuite"]
edition = "2021"

[lib]
name = "picturesuite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "ico", "tiff"] }
rayon = "1.10"
base64 = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
